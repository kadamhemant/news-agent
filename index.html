<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live news headlines across tech, AI, finance, business, and world news. Auto-updated every few hours.">
    <title>News Pulse — Live Headlines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>

    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="brand">
                    <div class="brand-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
                            <path d="M18 14h-8M15 18h-5M10 6h8v4h-8V6z"></path>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <h1>News Pulse</h1>
                        <span class="brand-subtitle">Live Headlines · Tech · Finance · World</span>
                    </div>
                </div>
                <div class="header-meta">
                    <div class="status">
                        <span class="status-dot"></span>
                        <span class="status-text">Live</span>
                    </div>
                    <span class="last-update" id="lastUpdate">Loading...</span>
                    <button class="refresh-btn" onclick="refreshData()" aria-label="Refresh">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        <span>Refresh</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Stats -->
        <section class="stats">
            <div class="stat-card">
                <div class="stat-label">Today's Stories</div>
                <div class="stat-value" id="totalArticles">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Sources</div>
                <div class="stat-value" id="totalSources">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Categories</div>
                <div class="stat-value">5</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Refresh</div>
                <div class="stat-value">2h</div>
            </div>
        </section>

        <!-- Filter chips -->
        <section class="filters">
            <div class="filter-scroll">
                <button class="chip active" data-category="all">
                    <span class="chip-icon">⚡</span> All
                </button>
                <button class="chip" data-category="tech">
                    <span class="chip-icon">💻</span> Tech
                </button>
                <button class="chip" data-category="ai">
                    <span class="chip-icon">🤖</span> AI
                </button>
                <button class="chip" data-category="finance">
                    <span class="chip-icon">📈</span> Finance
                </button>
                <button class="chip" data-category="business">
                    <span class="chip-icon">💼</span> Business
                </button>
                <button class="chip" data-category="world">
                    <span class="chip-icon">🌍</span> World
                </button>
            </div>
        </section>

        <!-- News grid -->
        <main class="content">
            <div class="news-grid" id="newsGrid">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </div>

            <div class="empty-state hidden" id="emptyState">
                <div class="empty-icon">📰</div>
                <h3>No stories in this category yet</h3>
                <p>Check back soon — headlines refresh every 6 hours</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <p class="footer-tag">Powered by <strong>NewsAPI</strong> · Auto-deployed by <strong>GitHub Actions</strong></p>
                <a href="https://github.com/kadamhemant/news-agent" target="_blank" rel="noopener" class="footer-link">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    View Source
                </a>
            </div>
        </footer>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
