<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Agent Dashboard | Live Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-3"/>
                    <path d="M18 17a6 6 0 0 0-6-6c0 2 3 2 3 9"/>
                    <path d="M6.2 21h11.6"/>
                </svg>
                <h1>News Agent Dashboard</h1>
            </div>
            <div class="header-meta">
                <span class="status-indicator live">Live</span>
                <span class="last-update" id="lastUpdate">Last updated: --:--</span>
            </div>
        </header>

        <!-- Stock Market Section -->
        <section class="market-section">
            <div class="section-header">
                <h2>📈 Stock Market</h2>
                <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
            </div>
            <div class="market-cards" id="marketCards">
                <!-- Market cards injected by JS -->
            </div>
        </section>

        <!-- News Section -->
        <section class="news-section">
            <div class="section-header">
                <h2>🔥 Top Headlines</h2>
                <div class="filter-tabs">
                    <button class="tab active" data-category="all">All</button>
                    <button class="tab" data-category="tech">Tech</button>
                    <button class="tab" data-category="ai">AI</button>
                    <button class="tab" data-category="finance">Finance</button>
                </div>
            </div>
            <div class="news-grid" id="newsGrid">
                <!-- News cards injected by JS -->
            </div>
        </section>

        <!-- Analytics Section -->
        <section class="analytics-section">
            <div class="section-header">
                <h2>📊 News Analytics</h2>
            </div>
            <div class="charts-container">
                <div class="chart-card">
                    <h3>News by Category</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>News Over Time</h3>
                    <div id="timelineChart"></div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Built with <strong>Hermes Agent</strong> • Powered by <strong>GitHub Actions</strong></p>
            <p><a href="https://github.com/kadamhemant/news-agent" target="_blank">View Source</a> • <a href="https://hermes-agent.nousresearch.com" target="_blank">Hermes Docs</a></p>
        </footer>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
