name: Deploy News Dashboard

on:
  schedule:
    # Run every 6 hours to fetch fresh data
    - cron: '0 */6 * * *'
    # Also at midnight UTC daily
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Fresh Data from APIs
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python generate_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Success notification
        run: |
          echo "🎉 Dashboard deployed successfully with live data!"
          echo "📊 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "📰 News API: NewsAPI.org"
          echo "📈 Market API: Finnhub.io + CoinGecko"
