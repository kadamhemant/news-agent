name: Deploy News Dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Update Data Files
        run: |
          python3 -c "
          import json
          from datetime import datetime
          
          news_data = [
              {
                  'title': 'OpenAI GPT-5 Revolutionary Reasoning',
                  'source': 'TechCrunch',
                  'category': 'ai',
                  'excerpt': 'OpenAI unveils GPT-5 with unprecedented abilities...',
                  'url': '#',
                  'date': datetime.now().strftime('%b %d, %I:%M %p'),
                  'timestamp': datetime.now().isoformat()
              },
              {
                  'title': 'Fed Signals Interest Rate Cut',
                  'source': 'Reuters',
                  'category': 'finance',
                  'excerpt': 'Powell hints at rate reduction as inflation cools...',
                  'url': '#',
                  'date': datetime.now().strftime('%b %d, %I:%M %p'),
                  'timestamp': datetime.now().isoformat()
              },
              {
                  'title': 'Tesla Stock Surges on FSD',
                  'source': 'Bloomberg',
                  'category': 'finance',
                  'excerpt': 'TSLA jumps 8% after FSD Beta 12.0 improvements...',
                  'url': '#',
                  'date': datetime.now().strftime('%b %d, %I:%M %p'),
                  'timestamp': datetime.now().isoformat()
              }
          ]
          
          with open('data/news.json', 'w') as f:
              json.dump(news_data, f, indent=2)
          
          market_data = [
              {'name': 'S&P 500', 'value': '5,234.18', 'change': '+1.24%', 'positive': True},
              {'name': 'Dow Jones', 'value': '41,087.13', 'change': '+0.89%', 'positive': True},
              {'name': 'NASDAQ', 'value': '16,447.20', 'change': '+1.42%', 'positive': True},
              {'name': 'BTC-USD', 'value': '$67,234.50', 'change': '-2.15%', 'positive': False}
          ]
          
          with open('data/market.json', 'w') as f:
              json.dump(market_data, f, indent=2)
          
          print('✅ Data updated successfully')
          "
      
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Success
        run: |
          echo "🎉 Dashboard deployed successfully!"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
