name: Update News Dashboard

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Fetch real-time market data
        run: |
          python -c "
          import json
          
          # Sample market data (replace with actual API calls)
          market_data = [
              {
                  'name': 'S&P 500',
                  'value': '5,234.18',
                  'change': '+1.24%',
                  'positive': True
              },
              {
                  'name': 'Dow Jones',
                  'value': '41,087.13',
                  'change': '+0.89%',
                  'positive': True
              },
              {
                  'name': 'NASDAQ',
                  'value': '16,447.20',
                  'change': '+1.42%',
                  'positive': True
              },
              {
                  'name': 'BTC-USD',
                  'value': '$67,234.50',
                  'change': '-2.15%',
                  'positive': False
              }
          ]
          
          with open('data/market.json', 'w') as f:
              json.dump(market_data, f, indent=2)
          
          print('Market data updated')
          "
      
      - name: Fetch latest news
        run: |
          python -c "
          import json
          import subprocess
          from datetime import datetime, timedelta
          
          # Fetch news from various sources (replace with real news APIs)
          # For demo, we create sample entries with current timestamps
          
          news_data = [
              {
                  'title': 'OpenAI Announces GPT-5 with Revolutionary Reasoning Capabilities',
                  'source': 'TechCrunch',
                  'category': 'ai',
                  'excerpt': 'OpenAI has unveiled GPT-5, featuring unprecedented reasoning abilities...',
                  'url': 'https://techcrunch.com/example1',
                  'date': datetime.now().strftime('%b %d, %I:%M %p'),
                  'timestamp': datetime.now().strftime('%Y-%m-%d %H:%M:%S')
              },
              {
                  'title': 'Federal Reserve Signals Interest Rate Cut in Q3 2026',
                  'source': 'Reuters',
                  'category': 'finance',
                  'excerpt': 'Fed Chair Powell hints at potential rate reduction as inflation cools...',
                  'url': 'https://reuters.com/example2',
                  'date': (datetime.now() - timedelta(hours=1)).strftime('%b %d, %I:%M %p'),
                  'timestamp': (datetime.now() - timedelta(hours=1)).strftime('%Y-%m-%d %H:%M:%S')
              },
              {
                  'title': 'Tesla Stock Surges on Autonomous Vehicle Breakthrough',
                  'source': 'Bloomberg',
                  'category': 'finance',
                  'excerpt': 'TSLA jumps 8% after FSD Beta 12.0 shows remarkable improvements...',
                  'url': 'https://bloomberg.com/example3',
                  'date': (datetime.now() - timedelta(hours=2)).strftime('%b %d, %I:%M %p'),
                  'timestamp': (datetime.now() - timedelta(hours=2)).strftime('%Y-%m-%d %H:%M:%S')
              }
          ]
          
          with open('data/news.json', 'w') as f:
              json.dump(news_data, f, indent=2)
          
          print('News data updated')
          "
      
      - name: Commit and push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || git commit -m "Update dashboard data [skip ci]"
          git push
      
      - name: Notify completion
        run: echo "Dashboard data updated successfully!"
