name: Update News Dashboard

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Export data
        run: |
          python3 -c "
          import json
          from datetime import datetime
          
          # News data
          news_data = [
              {
                  'title': 'OpenAI Announces GPT-5 with Revolutionary Reasoning',
                  'source': 'TechCrunch',
                  'category': 'ai',
                  'excerpt': 'OpenAI has unveiled GPT-5, featuring unprecedented reasoning abilities...',
                  'url': '#',
                  'date': datetime.now().strftime('%b %d, %I:%M %p'),
                  'timestamp': datetime.now().isoformat()
              },
              {
                  'title': 'Federal Reserve Signals Interest Rate Cut',
                  'source': 'Reuters',
                  'category': 'finance',
                  'excerpt': 'Fed Chair Powell hints at potential rate reduction...',
                  'url': '#',
                  'date': datetime.now().strftime('%b %d, %I:%M %p'),
                  'timestamp': datetime.now().isoformat()
              },
              {
                  'title': 'Tesla Stock Surges on Autonomous Vehicle Breakthrough',
                  'source': 'Bloomberg',
                  'category': 'finance',
                  'excerpt': 'TSLA jumps 8% after FSD Beta 12.0 improvements...',
                  'url': '#',
                  'date': datetime.now().strftime('%b %d, %I:%M %p'),
                  'timestamp': datetime.now().isoformat()
              }
          ]
          
          with open('data/news.json', 'w') as f:
              json.dump(news_data, f, indent=2)
          
          print('News data updated')
          
          # Market data
          market_data = [
              {'name': 'S&P 500', 'value': '5,234.18', 'change': '+1.24%', 'positive': True},
              {'name': 'Dow Jones', 'value': '41,087.13', 'change': '+0.89%', 'positive': True},
              {'name': 'NASDAQ', 'value': '16,447.20', 'change': '+1.42%', 'positive': True},
              {'name': 'BTC-USD', 'value': '$67,234.50', 'change': '-2.15%', 'positive': False}
          ]
          
          with open('data/market.json', 'w') as f:
              json.dump(market_data, f, indent=2)
          
          print('Market data updated')
          "
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
      
      - name: Notify completion
        run: echo "✅ Dashboard updated successfully!"
